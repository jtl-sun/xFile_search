name: Bootstrap source

on:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap_payload/READY2'

permissions:
  contents: write

concurrency:
  group: bootstrap-source-main
  cancel-in-progress: true

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact source
        shell: bash
        run: |
          cat bootstrap_payload/final_*.txt > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          mkdir -p /tmp/xfile_src
          tar -xzf /tmp/source.tar.gz -C /tmp/xfile_src
          cp -a /tmp/xfile_src/. .
          rm -rf bootstrap_payload
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit clean repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize xFile_search v0.1.25 source repository"
          git push origin HEAD:main
