name: Finalize clean source

on:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap_clean/READY'

permissions:
  contents: write

concurrency:
  group: finalize-clean-source-main
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          cat bootstrap_clean/source_*.b64 > /tmp/xfile_source.b64
          echo "086c02617e0d3a880c7295c1bf75adc1198c9628bd74d74e3bad47aa92613e28  /tmp/xfile_source.b64" | sha256sum -c -
          base64 -d /tmp/xfile_source.b64 > /tmp/xfile_source.tar.gz
          echo "0ebc2829cac47f0f67f4674e989edf3a633ea1e508534087b8b8776f08c85fb4  /tmp/xfile_source.tar.gz" | sha256sum -c -
          tar -tzf /tmp/xfile_source.tar.gz > /tmp/archive-files.txt
          test -s /tmp/archive-files.txt

      - name: Replace repository with exact source
        shell: bash
        run: |
          git rm -r --ignore-unmatch .
          tar -xzf /tmp/xfile_source.tar.gz -C .
          git add -A
          git status --short

      - name: Commit clean repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize xFile_search v0.1.26 source and installer"
          git push origin HEAD:main
