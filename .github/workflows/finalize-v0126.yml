name: Finalize v0.1.26 repository

on:
  push:
    branches: [ main ]
    paths:
      - 'bootstrap_final_v126/READY'

permissions:
  contents: write

concurrency:
  group: finalize-v0126
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract clean source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap_final_v126/chunk_*.b64 > /tmp/xfile_source.b64
          base64 -d /tmp/xfile_source.b64 > /tmp/xfile_source.tar.gz
          echo '873820a535243103a92d1a5fe700fa42b7bb506f10c0bfbe6209b74a45d79f2f  /tmp/xfile_source.tar.gz' | sha256sum -c -
          mkdir -p /tmp/xfile_source
          tar -xzf /tmp/xfile_source.tar.gz -C /tmp/xfile_source
          test -f /tmp/xfile_source/model.go
          test -f /tmp/xfile_source/ui_windows.go
          test -f /tmp/xfile_source/.github/workflows/release.yml
          test -f /tmp/xfile_source/INSTALL_KO.md

      - name: Replace repository with verified source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/xfile_source/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.1.26: clean source and easy installer'
          git push origin HEAD:main
